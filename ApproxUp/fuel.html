<!DOCTYPE HTML>
<head>
	<title>Approximately Up - Fuel Mixing</title>
	<style>
		.chart-line {
			background-color: blue;
			bottom: var(--y);
			height: 1px;
			left: var(--x);
			position: absolute;
			transform: rotate(calc(var(--angle) * 1deg));
			transform-origin: left bottom;
			width: calc(var(--hypotenuse) * 1px);
		}
	</style>
	<script>
		// base stability, stability power, efficiency power, efficiency mult, curve P1, curve P2
		const redProps = [0.4, 1.4, 1/3, 0.9, 0.05, -0.12];
		const greenProps = [0.25, 0.9, 0.4, 0.48, 1.4, 1.05];
		const blueProps = [1.0, 0.6, 1.0, 0.4, 0.55, 0.8];
		
		function getFuelStability(red, green, blue) {
			let quantitySum = 0;
			let stabilitySum = 0;
			
			let quantityRed = Math.pow(red, redProps[1]);
			quantitySum += quantityRed;
			stabilitySum += quantityRed * redProps[0];
			
			let quantityGreen = Math.pow(green, greenProps[1]);
			quantitySum += quantityGreen;
			stabilitySum += quantityGreen * greenProps[0];
			
			let quantityBlue = Math.pow(blue, blueProps[1]);
			quantitySum += quantityBlue;
			stabilitySum += quantityBlue * blueProps[0];
			
			stabilitySum /= quantitySum;
			if (stabilitySum > 1) return 1;
			if (stabilitySum < 0) return 0;
			return stabilitySum;
		}
		
		function bezier01(pos, c1, c2) {
			let flip = 1 - pos;
			return flip * flip * 3 * pos * c1 +
				   flip * 3 * pos * pos * c2 +
				   pos * pos * pos;
		}
		
		function getFuelEfficiencyValues(red, green, blue) {
			let quantitySum = 0;
			let effMult = 0;
			let curveP1 = 0;
			let curveP2 = 0;
			
			let quantityRed = Math.pow(red, redProps[2]);
			quantitySum += quantityRed;
			effMult += quantityRed * redProps[3];
			curveP1 += quantityRed * redProps[4];
			curveP2 += quantityRed * redProps[5];
			
			let quantityGreen = Math.pow(green, greenProps[2]);
			quantitySum += quantityGreen;
			effMult += quantityGreen * greenProps[3];
			curveP1 += quantityGreen * greenProps[4];
			curveP2 += quantityGreen * greenProps[5];
			
			let quantityBlue = Math.pow(blue, blueProps[2]);
			quantitySum += quantityBlue;
			effMult += quantityBlue * blueProps[3];
			curveP1 += quantityBlue * blueProps[4];
			curveP2 += quantityBlue * blueProps[5];
			
			effMult /= quantitySum;
			curveP1 /= quantitySum;
			curveP2 /= quantitySum;
			
			let values = [];
			for (let a = 0; a <= 200; a++) {
				let thrust = a / 200;
				values[a] = bezier01(thrust, curveP1, curveP2) * effMult;
			}
			return values;
		}
		
		let redFuel = 0;
		let greenFuel = 0;
		let blueFuel = 0;
		
		window.addEventListener("load", function() {
			let linegraph = document.getElementById("linegraph");
			
			let redSlider = document.getElementById("redfuel");
			redSlider.oninput = function() {
				redFuel = Number(redSlider.value);
				if ((redFuel + greenFuel) > 1) {
					redFuel = 1 - greenFuel;
					redSlider.value = redFuel;
				}
				blueFuel = 1 - redFuel - greenFuel;
				if (blueFuel < 0) blueFuel = 0; // occasionally happens
				computeFuel();
			}
			redFuel = Number(redSlider.value);
			
			let greenSlider = document.getElementById("greenfuel");
			greenSlider.oninput = function() {
				greenFuel = Number(greenSlider.value);
				if ((redFuel + greenFuel) > 1) {
					greenFuel = 1 - redFuel;
					greenSlider.value = greenFuel;
				}
				blueFuel = 1 - redFuel - greenFuel;
				if (blueFuel < 0) blueFuel = 0; // occasionally happens
				computeFuel();
			}
			greenFuel = Number(greenSlider.value);
			
			blueFuel = 1 - redFuel - greenFuel;
			if (blueFuel < 0) blueFuel = 0; // occasionally happens
			
			function showFuelMix() {
				let stability = getFuelStability(redFuel, greenFuel, blueFuel);
				document.getElementById("fuelmix").innerHTML = "Mixture: " + redFuel.toLocaleString(undefined, {style:"percent",minimumFractionDigits:1}) + ":" + greenFuel.toLocaleString(undefined, {style:"percent",minimumFractionDigits:1}) + ":" + blueFuel.toLocaleString(undefined, {style:"percent",minimumFractionDigits:1});
				document.getElementById("fuelstab").innerHTML = "Stability: " + stability.toLocaleString(undefined, {style:"percent",minimumFractionDigits:3});
				
				let newLine = document.createElement("div");
				newLine.className = "chart-line";
				newLine.style.cssText = `--y: ${400 * stability}px; --x: 0px; --hypotenuse: 400; --angle: 0; background-color: red`;
				linegraph.appendChild(newLine);
			}
			
			function createLineGraph() {
				let stability = getFuelStability(redFuel, greenFuel, blueFuel);
				
				const height = 400;
				let values = getFuelEfficiencyValues(redFuel, greenFuel, blueFuel);
				const numLines = values.length - 1;
				const step = 400 / numLines;
				
				let bestValue = 0;
				if (values[values.length - 1] <= stability) bestValue = values[values.length - 1];
				let bestValueAt = values.length - 1;
				
				for (let a = 0; a < numLines; a++) {
					if (values[a] <= stability && values[a] > bestValue) {
						bestValue = values[a];
						bestValueAt = a;
					}
					
					let left = 400 * a / numLines;
					
					let curValue = values[a];
					let nextValue = values[a+1];
					let bottom = 400 * values[a];
					let rise = 400 * (values[a] - values[a+1]);
					let hypot = Math.sqrt(step * step + rise * rise);
					let angle = Math.asin(rise / hypot) * 180 / Math.PI;
					
					let newLine = document.createElement("div");
					newLine.className = "chart-line";
					newLine.style.cssText = `--y: ${bottom}px; --x: ${left}px; --hypotenuse: ${hypot}; --angle: ${angle}`;
					linegraph.appendChild(newLine);
				}
				
				document.getElementById("peakeff").innerHTML = "Peak thrust: " + bestValue.toLocaleString(undefined, {style:"percent",minimumFractionDigits:1}) + "<br/>Throttle target: " + (bestValueAt / (values.length - 1)).toLocaleString(undefined, {style:"percent",minimumFractionDigits:1});
			}
			
			function computeFuel() {
				linegraph.innerHTML = "";
				showFuelMix();
				createLineGraph();
			}
			
			computeFuel();
		});
	</script>
</head>
<body>
	<div style="display: grid; grid-template-columns: min-content min-content">
		<div></div>
		<input type="range" min="0" max="1" step="0.001" value="0" id="redfuel" style="accent-color: red"/>
		<input type="range" min="0" max="1" step="0.001" value="0" id="greenfuel" style="accent-color: green; writing-mode: vertical-lr"/>
		<div><image src="fuel-triangle.png" style="padding: 10px"/></div>
	</div>
	<div>
		<p id="fuelmix"></p>
		<p id="fuelstab"></p>
	</div>
	<div id="linegraph" style="list-style: none; margin: 0; padding: 0; width: 400px; height: 400px; border: 1px solid black; position: relative"></div>
	<p id="peakeff"></p>
</body>
